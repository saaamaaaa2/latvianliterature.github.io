<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Авторы</title>
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f4f6fb;
  color: #1a1a1a;
}

/* ===== ШАПКА ===== */
.top-menu {
  background: #2f3e46;
  padding: 15px 10%;
}

.top-menu nav {
  display: flex;
  gap: 30px;
}

.top-menu a {
  color: white;
  text-decoration: none;
  font-weight: 500;
  transition: 0.3s;
}

.top-menu a:hover {
  opacity: 0.7;
}

/* ===== HERO ===== */
.page-hero {
  padding: 80px 10%;
  background: linear-gradient(135deg, #2f3e46, #52796f);
  color: white;
  text-align: center;
}

.page-hero h1 {
  margin: 0;
  font-size: 40px;
}

/* ===== MAIN ===== */
main {
  padding: 60px 10%;
}

/* ===== КНОПКА + ПОИСК ===== */
.top-controls {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 30px;
  flex-wrap: wrap;
}

.filter-toggle {
  background: #2f3e46;
  color: white;
  padding: 12px 25px;
  border-radius: 25px;
  cursor: pointer;
  transition: 0.3s;
  white-space: nowrap;
}

.filter-toggle:hover {
  background: #52796f;
}

.search-input {
  padding: 12px 20px;
  border-radius: 25px;
  border: 1px solid #cad2c5;
  min-width: 250px;
}

.search-input:focus {
  outline: none;
  border-color: #52796f;
  box-shadow: 0 0 0 3px rgba(82,121,111,0.15);
}

/* ===== ПАНЕЛЬ ===== */
.filter-panel {
  background: white;
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 40px;
  box-shadow: 0 8px 25px rgba(47,62,70,0.08);
  display: none;
}

.filter-panel.active {
  display: flex;
  gap: 40px;
  flex-wrap: wrap;
}

.filter-group {
  display: flex;
  flex-direction: column;
  min-width: 220px;
}

.filter-group h4 {
  margin-bottom: 10px;
  color: #2f3e46;
}

.filter-group button,
.filter-group select {
  padding: 8px 12px;
  border-radius: 12px;
  border: 1px solid #cad2c5;
  margin-bottom: 10px;
}

.filter-group button {
  background: #cad2c5;
  border: none;
  cursor: pointer;
}

.filter-group button:hover {
  background: #52796f;
  color: white;
}

/* ===== СПИСОК ===== */
#authorsList {
  display: flex;
  flex-direction: column;
  gap: 25px;
}

.author-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: white;
  padding: 30px;
  border-radius: 20px;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 8px 25px rgba(47,62,70,0.08);
  transition: 0.3s;
}

.author-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 15px 35px rgba(82,121,111,0.25);
}

.author-info h3 {
  margin: 0 0 8px 0;
  color: #2f3e46;
}

.author-info p {
  margin: 0;
  color: #52796f;
}

.author-photo {
  width: 120px;
  height: 120px;
  border-radius: 20px;
  overflow: hidden;
  background: #cad2c5;
}

.author-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

footer {
  text-align: center;
  padding: 30px;
  background: #2f3e46;
  color: white;
}

/* ===== АДАПТИВ ===== */
@media (max-width: 768px) {
  .author-card {
    flex-direction: column;
    align-items: flex-start;
    gap: 20px;
  }

  .author-photo {
    width: 100px;
    height: 100px;
  }
}
</style>
</head>

<body>

<header class="top-menu">
  <nav>
    <a href="index.html">Главная</a>
<a href="authors.html">Авторы</a>
<a href="search.html">Поиск</a>
<a href="register.html">Вход / Регистрация</a>
  </nav>
</header>

<section class="page-hero">
  <h1>Авторы латышской литературы</h1>
</section>

<main>

<div class="top-controls">
  <div class="filter-toggle" onclick="toggleFilters()">
    Фильтр и сортировка
  </div>

  <input type="text"
         id="searchInput"
         class="search-input"
         placeholder="Поиск по имени..."
         oninput="applyFilters()">
</div>

<div id="filterPanel" class="filter-panel">

  <div class="filter-group">
    <h4>Сортировка</h4>
    <button onclick="sortAuthors('az')">А–Я</button>
    <button onclick="sortAuthors('za')">Я–А</button>
  </div>

  <div class="filter-group">
    <h4>Первая буква</h4>
    <select id="letterFilter" onchange="applyFilters()">
      <option value="all">Все</option>
      <option value="B">B</option>
      <option value="V">V</option>
    </select>
  </div>

  <div class="filter-group">
    <h4>Жанр</h4>
    <select id="genreFilter" onchange="applyFilters()">
      <option value="all">Все</option>
    </select>
  </div>

</div>

<div id="authorsList">

  <a href="authors/blaumanis.html"
     class="author-card"
     data-name="Rūdolfs Blaumanis"
     data-letter="B"
     data-genre="Реализм">

    <div class="author-info">
      <h3>Rūdolfs Blaumanis</h3>
      <p>Реализм, драма, рассказы</p>
    </div>

    <div class="author-photo">
      <img src="images/blaumanis.jpg" alt="Blaumanis">
    </div>
  </a>

  <a href="authors/Veidenbaums.html"
     class="author-card"
     data-name="Eduards Veidenbaums"
     data-letter="V"
     data-genre="Социальная лирика">

    <div class="author-info">
      <h3>Eduards Veidenbaums</h3>
      <p>Социальная лирика, сатира</p>
    </div>

    <div class="author-photo">
      <img src="images/veidenbaums.jpg" alt="Veidenbaums">
    </div>
  </a>

</div>

</main>

<footer>
  © Проект переводов латышской литературы
</footer>

<script>
function toggleFilters() {
  document.getElementById("filterPanel").classList.toggle("active");
}

function sortAuthors(type) {
  const list = document.getElementById("authorsList");
  const cards = Array.from(list.children);

  cards.sort((a, b) => {
    const nameA = a.dataset.name.toLowerCase();
    const nameB = b.dataset.name.toLowerCase();
    return type === "az"
      ? nameA.localeCompare(nameB)
      : nameB.localeCompare(nameA);
  });

  cards.forEach(card => list.appendChild(card));
}

function applyFilters() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const letter = document.getElementById("letterFilter").value;
  const genre = document.getElementById("genreFilter").value;

  document.querySelectorAll(".author-card").forEach(card => {
    const name = card.dataset.name.toLowerCase();
    const matchSearch = name.includes(search);
    const matchLetter = letter === "all" || card.dataset.letter === letter;
    const matchGenre = genre === "all" || card.dataset.genre === genre;

    card.style.display =
      (matchSearch && matchLetter && matchGenre) ? "flex" : "none";
  });
}
</script>

</body>
</html>
