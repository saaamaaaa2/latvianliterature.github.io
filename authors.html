<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Авторы</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<style>

/* ===== Заголовок ===== */
h1 {
  margin-bottom: 20px;
}

/* ===== Кнопка открытия фильтра ===== */
.filter-toggle {
  background: #444;
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  cursor: pointer;
  display: inline-block;
  margin-bottom: 20px;
  transition: 0.3s;
}

.filter-toggle:hover {
  background: #666;
}

/* ===== Панель фильтра ===== */
/* ===== Панель фильтра ===== */
.filter-panel {
  background: white;
  border-radius: 20px;
  padding: 25px;
  margin-bottom: 30px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
  display: none;
  animation: fadeIn 0.3s ease;

  display: none;
}

.filter-panel.active {
  display: flex;
  gap: 40px;
  flex-wrap: wrap; /* чтобы красиво переносилось на маленьком экране */
}

/* Группа фильтра */
.filter-group {
  display: flex;
  flex-direction: column;
  min-width: 220px;
}

.filter-group button,
.filter-group select,
.filter-group input {
  padding: 8px 12px;
  border-radius: 12px;
  border: 1px solid #ddd;
  margin-right: 10px;
  margin-bottom: 10px;
}

.filter-group button {
  background: #eee;
  cursor: pointer;
  transition: 0.2s;
}

.filter-group button:hover {
  background: #ddd;
}

/* ===== Список авторов ===== */
#authorsList {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ===== Карточка автора ===== */
.author-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: white;
  padding: 25px;
  border-radius: 20px;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
  transition: 0.3s ease;
}

.author-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.12);
}

.author-info h3 {
  margin: 0 0 8px 0;
}

.author-info p {
  margin: 0;
  color: #666;
}

/* Фото справа */
.author-photo {
  width: 110px;
  height: 110px;
  border-radius: 20px;
  overflow: hidden;
  background: #ddd;
  flex-shrink: 0;
}

.author-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

@keyframes fadeIn {
  from {opacity: 0; transform: scale(0.98);}
  to {opacity: 1; transform: scale(1);}
}

</style>
</head>
<body>

<header class="top-menu" data-aos="fade-down">
  <nav>
    <a href="index.html">Главная</a>
    <a href="authors.html">Авторы</a>
    <a href="search.html">Поиск</a>
    <a href="register.html">Вход / Регистрация</a>
  </nav>
</header>

<main>
  <section data-aos="fade-up">
    <h1>Авторы</h1>

    <!-- КНОПКА ФИЛЬТРА -->
    <div class="filter-toggle" onclick="toggleFilters()">
      Фильтр и сортировка
    </div>

    <!-- ПАНЕЛЬ -->
    <div id="filterPanel" class="filter-panel">

      <div class="filter-group">
        <h4>Сортировка</h4>
        <button onclick="sortAuthors('az')">А–Я</button>
        <button onclick="sortAuthors('za')">Я–А</button>
      </div>

      <div class="filter-group">
        <h4>Поиск по имени</h4>
        <input type="text" id="searchInput" 
               placeholder="Введите имя..." 
               oninput="applyFilters()">
      </div>

      <div class="filter-group">
        <h4>Первая буква</h4>
        <select id="letterFilter" onchange="applyFilters()">
          <option value="all">Все</option>
          <option value="B">B</option>
          <option value="V">V</option>
        </select>
      </div>

      <div class="filter-group">
        <h4>Жанр</h4>
        <select id="genreFilter" onchange="applyFilters()">
          <option value="all">Все</option>
          <option value="Реализм">Реализм</option>
          <option value="Социальная лирика">Социальная лирика</option>
        </select>
      </div>

    </div>

    <!-- СПИСОК АВТОРОВ -->
    <div id="authorsList">

      <a href="authors/blaumanis.html"
         class="author-card"
         data-name="Rūdolfs Blaumanis"
         data-letter="B"
         data-genre="Реализм"
         data-aos="zoom-in">

        <div class="author-info">
          <h3>Rūdolfs Blaumanis</h3>
          <p>Реализм, драма, рассказы</p>
        </div>

        <div class="author-photo">
          <img src="images/blaumanis.jpg" alt="Blaumanis">
        </div>
      </a>


      <a href="authors/Veidenbaums.html"
         class="author-card"
         data-name="Eduards Veidenbaums"
         data-letter="V"
         data-genre="Социальная лирика"
         data-aos="zoom-in">

        <div class="author-info">
          <h3>Eduards Veidenbaums</h3>
          <p>Социальная лирика, сатира</p>
        </div>

        <div class="author-photo">
          <img src="images/veidenbaums.jpg" alt="Veidenbaums">
        </div>
      </a>

    </div>

  </section>
</main>

<footer data-aos="fade-up">
  <p>© Проект переводов латышской литературы</p>
</footer>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
AOS.init({ duration: 1000, once: true });

function toggleFilters() {
  document.getElementById("filterPanel")
          .classList.toggle("active");
}

function sortAuthors(type) {
  const list = document.getElementById("authorsList");
  const cards = Array.from(list.children);

  cards.sort((a, b) => {
    const nameA = a.dataset.name.toLowerCase();
    const nameB = b.dataset.name.toLowerCase();
    return type === "az"
      ? nameA.localeCompare(nameB)
      : nameB.localeCompare(nameA);
  });

  cards.forEach(card => list.appendChild(card));
}

function applyFilters() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const letter = document.getElementById("letterFilter").value;
  const genre = document.getElementById("genreFilter").value;

  document.querySelectorAll(".author-card").forEach(card => {

    const name = card.dataset.name.toLowerCase();
    const cardLetter = card.dataset.letter;
    const cardGenre = card.dataset.genre;

    const matchSearch = name.includes(search);
    const matchLetter = letter === "all" || cardLetter === letter;
    const matchGenre = genre === "all" || cardGenre === genre;

    if (matchSearch && matchLetter && matchGenre) {
      card.style.display = "flex";
    } else {
      card.style.display = "none";
    }

  });
}
</script>

</body>
</html>

</body>
</html>
